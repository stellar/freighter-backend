name: Build and push freighter-backend (dev)

# Deployed to: https://github.com/stellar/freighter-backend
#
# Converted from the Jenkins pipeline (Jenkinsfile-dev). Builds the
# freighter-backend docker image and pushes it to the dev ECR repo
# (dev/freighter-backend-dev:<sha>). The Jenkins job had no webhook trigger —
# it was run manually — so this workflow is manual-dispatch only.

on:
  workflow_dispatch:
    inputs:
      deploy_to_dev:
        description: >-
          Also deploy this image to the SHARED wallet-eng-dev environment.
          Leave unchecked for sandbox/preview builds — the sandbox pins the
          plain <sha> tag either way and does not need this.
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  SLACK_CHANNEL: ext-freighter-builds

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine image label
        id: vars
        run: echo "label=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: ECR login
        id: ecr-login
        uses: stellar/actions/sdf-ecr-login@main

      # The plain <sha> tag is what per-engineer sandboxes pin, and is always
      # pushed. The `dev-` prefixed tag is what the shared wallet-eng-dev
      # ArgoCD ImageUpdater watches (allowTags: regexp:^dev-), so it is pushed
      # only when this build explicitly opts in.
      #
      # Before this split the updater followed the plain <sha> tags with
      # newest-build and no filter, so ANY branch build captured shared dev.
      # That is not hypothetical here: dev ran freighter-backend-dev:a99ffe9
      # for five days, an image built from PR #324's branch nine minutes
      # before it merged.
      - name: Build and push docker image
        id: push
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.ecr-registry }}
          LABEL: ${{ steps.vars.outputs.label }}
          DEPLOY_TO_DEV: ${{ inputs.deploy_to_dev }}
        run: |
          set -eu
          export TAG="${ECR_REGISTRY}/dev/freighter-backend-dev:${LABEL}"
          make docker-build
          ecr-push "${TAG}"

          # `summary` is built by whichever branch actually ran, so the Slack
          # message cannot drift from what was really pushed. Keep it on one
          # line and free of double quotes — it is interpolated into the JSON
          # payload below.
          if [ "${DEPLOY_TO_DEV}" = "true" ]; then
            DEV_TAG="${ECR_REGISTRY}/dev/freighter-backend-dev:dev-${LABEL}"
            docker tag "${TAG}" "${DEV_TAG}"
            ecr-push "${DEV_TAG}"
            echo "Pushed ${TAG} and ${DEV_TAG}."
            echo "The dev- tag is the one shared wallet-eng-dev follows."
            echo "summary=pushed \`${LABEL}\` and \`dev-${LABEL}\` (opted in to shared wallet-eng-dev)" >> "$GITHUB_OUTPUT"
          else
            echo "Pushed ${TAG}. No dev- tag was published."
            echo "Pin this tag in your sandbox."
            echo "summary=pushed \`${LABEL}\` (no dev- tag; shared dev not targeted)" >> "$GITHUB_OUTPUT"
          fi

      - name: Slack notification — success
        if: success()
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL }}",
              "text": "Freighter backend *dev* build complete for ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }} — ${{ steps.push.outputs.summary }}."
            }

      - name: Slack notification — failure
        if: failure()
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL }}",
              "text": "Freighter backend *dev* build failed for ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}."
            }
